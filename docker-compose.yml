x-wp-config-extra: &wp-config-extra |
  define('WP_ENVIRONMENT_TYPE', 'local');
  define('WP_DEBUG_LOG', true);
  define('WP_DEBUG_DISPLAY', false);
  define('WP_MEMORY_LIMIT', '256M');
  define('WP_MAX_MEMORY_LIMIT', '512M');
  define('FS_METHOD', 'direct');
  define('WP_POST_REVISIONS', 10);
  define('DISALLOW_FILE_EDIT', true); // docs/security.md §2 — też na dev

services:
  db:
    image: mariadb:11
    container_name: ${PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php${PHP_VERSION}-apache
    container_name: ${PROJECT_NAME}_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    # WordPress odpytuje sam siebie pod adresem strony (cron, Site Health) —
    # w kontenerze localhost:${WP_PORT} też musi odpowiadać, więc Apache słucha dodatkowo na tym porcie.
    command: >
      bash -c "grep -q 'Listen ${WP_PORT}' /etc/apache2/ports.conf || echo 'Listen ${WP_PORT}' >> /etc/apache2/ports.conf;
      sed -i 's/<VirtualHost \\*:80>/<VirtualHost *:80 *:${WP_PORT}>/' /etc/apache2/sites-available/000-default.conf;
      exec docker-entrypoint.sh apache2-foreground"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/${THEME_NAMESPACE}:/var/www/html/wp-content/themes/${THEME_NAMESPACE}
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  # Lokalna skrzynka — żaden mail nie wychodzi na zewnątrz.
  mailpit:
    image: axllent/mailpit
    container_name: ${PROJECT_NAME}_mail
    restart: unless-stopped
    ports:
      - "${MAIL_PORT}:8025"

  wpcli:
    image: wordpress:cli-php${PHP_VERSION}
    container_name: ${PROJECT_NAME}_cli
    profiles: ["tools"]
    network_mode: service:wordpress
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/${THEME_NAMESPACE}:/var/www/html/wp-content/themes/${THEME_NAMESPACE}
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
    entrypoint: ["php", "-d", "memory_limit=512M", "/usr/local/bin/wp"]

volumes:
  db_data:
  wp_core:
